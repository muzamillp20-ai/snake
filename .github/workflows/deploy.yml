# GitHub Actions workflow for Mahira Mansha Snake Crash
# Repository: https://github.com/muzamillp20-ai/snake
# Expected URL: https://muzamillp20-ai.github.io/snake/

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build production application
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f "./dist/index.html" ]; then
            echo "❌ ERROR: dist/index.html not found after build!"
            ls -la dist/ || echo "dist/ directory does not exist"
            exit 1
          fi
          echo "✅ Build output verified: dist/index.html exists"
          echo "📦 Build contents:"
          ls -la dist/
          echo ""
          echo "📄 Checking index.html for correct base path..."
          if grep -q "/snake/" dist/index.html; then
            echo "✅ Base path /snake/ found in index.html"
          else
            echo "⚠️  Warning: Base path /snake/ not found in index.html"
          fi

      - name: Check Pages configuration
        if: github.event_name != 'pull_request'
        run: |
          echo "🔍 Checking if GitHub Pages is configured..."
          echo ""
          echo "⚠️  IMPORTANT: If this step fails, you need to:"
          echo "1. Go to https://github.com/muzamillp20-ai/snake/settings/pages"
          echo "2. Under 'Build and deployment', set Source to: GitHub Actions"
          echo "3. Save the setting"
          echo "4. Re-run this workflow"
          echo ""

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
